<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create listing | MODO</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<body>

<header id="siteHeader"></header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <h1 class="fw-bold mb-2">Create a listing</h1>

                <p class="text-muted mb-4">
                    Give your item a new home. Add the details below.
                </p>

                <form id="createListingForm">

                    <div class="mb-4">
                        <label for="listingTitle" class="form-label">
                            Listing title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="listingTitle"
                            name="title"
                            placeholder="What are you selling?"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="listingDescription" class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="listingDescription"
                            name="description"
                            rows="5"
                            placeholder="Describe your item..."
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="listingDeadline" class="form-label">
                            Auction end date
                        </label>

                        <input
                            type="datetime-local"
                            class="form-control"
                            id="listingDeadline"
                            name="endsAt"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="listingImage" class="form-label">
                            Image URL
                        </label>

                        <input
                            type="url"
                            class="form-control"
                            id="listingImage"
                            name="image"
                            placeholder="https://example.com/image.jpg"
                        >

                        <div class="form-text">
                            Add a public image URL for your item.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="listingTags" class="form-label">
                            Tags
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="listingTags"
                            name="tags"
                            placeholder="e.g. furniture, books, electronics"
                        >

                        <div class="form-text">
                            Separate tags with commas.
                        </div>
                    </div>

                    <div
                        id="formError"
                        class="alert alert-danger d-none"
                        role="alert"
                    ></div>

                    <div
                        id="formSuccess"
                        class="alert alert-success d-none"
                        role="status"
                    ></div>

                    <button
                        type="submit"
                        class="btn modo-button w-100"
                    >
                        Create listing
                    </button>

                </form>

            </div>
        </div>
    </main>

    <footer class="border-top py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">
                &copy; 2026 MODO. A marketplace made for students.
            </p>
        </div>
    </footer>

    <script type="module" src="/src/js/pages/listing-create.js"></script>

</body>
</html>
