<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | MODO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/css/styles.css">

<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/index.html">MODO</a>

      <div class="ms-auto">
        <span class="text-muted me-2">New to MODO?</span>
        <a href="register.html" class="btn btn-outline-dark">
          Sign up
        </a>
      </div>
    </div>
  </nav>

<main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-4">
          <h1 class="fw-bold">Welcome back</h1>
          <p class="text-muted">
            Log in to discover great finds and deals.
          </p>
        </div>

        <form id="loginForm">

       <div class="mb-3">
            <label for="email" class="form-label">
              Student email
            </label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@stud.noroff.no"
              required
            >
          </div>
          
         <div class="mb-4">
            <label for="password" class="form-label">
              Password
            </label>

            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            >
          </div>

          <div
            id="loginMessage"
            class="mb-3"
            aria-live="polite"
          ></div>

            <button
            type="submit"
            class="btn btn-dark w-100"
          >
            Log in
          </button> 
 
</form>

 <p class="text-center mt-4">
          Don't have an account?
          <a href="register.html">Create an account</a>
        </p>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/js/pages/login.js"></script>
</body>
</html>
