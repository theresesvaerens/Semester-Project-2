<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | MODO</title>

 <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MODO</a>

      <div class="ms-auto">
        <span class="text-muted me-2">Already a member?</span>
        <a href="login.html" class="btn btn-outline-dark">
          Log in
        </a>
      </div>
    </div>
  </nav>

<main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-4">
          <h1 class="fw-bold">Create your account</h1>
          <p class="text-muted">
            Join MODO and discover great finds from fellow students.
          </p>
        </div>

        <form id="registerForm">
  

          <div class="mb-3">
            <label for="name" class="form-label">
              Username
            </label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              placeholder="Choose a username"
              pattern="[A-Za-z0-9_]+"
              required
            >
          </div>

                    <div class="mb-3">
            <label for="email" class="form-label">
              Student email
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@stud.noroff.no"
              pattern=".+@stud\.noroff\.no$"
              required
            >
            <div class="form-text">
              You need a valid Noroff student email.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Password
            </label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            >
          </div>


                    <div class="mb-4">
            <label for="confirmPassword" class="form-label">
              Confirm password
            </label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter your password again"
              minlength="8"
              required
            >
          </div>

  </body>
</html>
