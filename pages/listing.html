<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore listings | MODO</title>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/src/css/styles.css">

</head>

<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MODO</a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="listing.html" class="btn btn-outline-dark">
          Explore
        </a>
        <a href="listing-create.html" class="btn btn-dark">
          Create listing
        </a>
        <a href="login.html" class="btn btn-link text-dark">
          Log in
        </a>
      </div>
    </div>
  </nav>

   <main class="container py-5">

    <div class="mb-4">
      <h1 class="fw-bold">Explore listings</h1>
      <p class="text-muted">
        Discover great finds from fellow students.
      </p>
    </div>

    <div class="row mb-4">
      <div class="col-12 col-md-6">
        <label for="searchInput" class="form-label">
          Search listings
        </label>
        <input
          type="search"
          class="form-control"
          id="searchInput"
          placeholder="Search for something...">
      </div>
    </div>

    <p id="loadingMessage" aria-live="polite">
      Loading listings...
    </p>

    <div
      id="errorMessage"
      class="text-danger mb-3"
      role="alert">
    </div>

    <div
      id="listingsContainer"
      class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    </div>

     <div
      id="listingsContainer"
      class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    </div>

    <p id="emptyMessage" class="text-muted text-center d-none">
      No listings found.
    </p>

   </main>

  <footer class="border-top py-4">
    <div class="container text-center">
      <p class="text-muted mb-0">
        &copy; 2026 MODO. A marketplace made for students.
      </p>
    </div>
  </footer>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/src/js/pages/listing.js" defer></script>

</body>
</html>
