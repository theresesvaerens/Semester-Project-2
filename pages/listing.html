<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing details | MODO</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<body>

<header id="siteHeader"></header>

    <main class="container py-5">

        <a href="/" class="text-decoration-none text-dark">
            &larr; Back to listings
        </a>

        <p id="loadingMessage" class="mt-4" aria-live="polite">
            Loading listing...
        </p>

        <div
            id="errorMessage"
            class="text-danger mt-4"
            role="alert">
        </div>

        <div
            id="deleteErrorMessage"
            class="alert alert-danger mt-4 d-none"
            role="alert">
        </div>

        <section id="listingDetails" class="mt-4 d-none">

            <div class="row g-5">

                <div class="col-12 col-lg-6">
                    <img
                        id="listingImage"
                        class="img-fluid rounded"
                        src=""
                        alt=""
                    >
                </div>

                <div class="col-12 col-lg-6">

                    <h1 id="listingTitle" class="fw-bold"></h1>

                    <p id="listingDescription" class="text-muted"></p>

                    <p>
                        <strong>Ends:</strong>
                        <span id="listingDeadline"></span>
                    </p>

                    <p>
                        <strong>Seller:</strong>
                        <span id="listingSeller"></span>
                    </p>

                    <hr>

                    <div id="bidSection" class="mb-4">

                        <h2 class="h4 fw-bold mb-3">Place a bid</h2>

                        <p
                            id="loginToBidMessage"
                            class="text-muted d-none">
                            Please log in to place a bid.
                        </p>

                        <form id="bidForm" class="d-none">

                            <div class="mb-3">
                                <label for="bidAmount" class="form-label">
                                    Your bid (credits)
                                </label>

                                <input
                                    type="number"
                                    id="bidAmount"
                                    class="form-control"
                                    min="1"
                                    step="1"
                                    required
                                    placeholder="Enter your bid"
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn modo-button">
                                Place bid
                            </button>

                        </form>

                        <div
                            id="bidError"
                            class="alert alert-danger mt-3 d-none"
                            role="alert">
                        </div>

                        <div
                            id="bidSuccess"
                            class="alert alert-success mt-3 d-none"
                            role="status">
                        </div>

                    </div>

                    <hr>

                    <h2 class="h4 fw-bold mb-3">Bid history</h2>

                    <div id="bidHistory">
                        <p class="text-muted">
                            Loading bid history...
                        </p>
                    </div>

                    <button
                        id="deleteListingButton"
                        class="btn btn-outline-danger mt-4 d-none"
                        type="button">
                        Delete listing
                    </button>

                </div>
            </div>

        </section>

    </main>

    <footer class="border-top py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">
                &copy; 2026 MODO. A marketplace made for students.
            </p>
        </div>
    </footer>

    <script type="module" src="/src/js/pages/listing.js"></script>

</body>
</html>
