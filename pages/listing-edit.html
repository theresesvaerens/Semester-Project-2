<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit listing | MODO</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<body>


    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">MODO</a>

            <a href="/" class="btn btn-outline-dark">
                Back to explore
            </a>
        </div>
    </nav>


    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <h1 class="fw-bold mb-2">Edit listing</h1>

                <p class="text-muted mb-4">
                    Update the details of your listing below.
                </p>

                <p id="loadingMessage" aria-live="polite">
                    Loading listing...
                </p>

                <div
                    id="formError"
                    class="alert alert-danger d-none"
                    role="alert"
                ></div>

                <div
                    id="formSuccess"
                    class="alert alert-success d-none"
                    role="status"
                ></div>

                
                <form id="editListingForm" class="d-none">

                    <div class="mb-4">
                        <label for="listingTitle" class="form-label">
                            Listing title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="listingTitle"
                            name="title"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="listingDescription" class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="listingDescription"
                            name="description"
                            rows="5"
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="listingDeadline" class="form-label">
                            Auction end date
                        </label>

                        <input
                            type="datetime-local"
                            class="form-control"
                            id="listingDeadline"
                            name="endsAt"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="listingImage" class="form-label">
                            Image URL
                        </label>

                        <input
                            type="url"
                            class="form-control"
                            id="listingImage"
                            name="image"
                        >
                    </div>

                    <div class="mb-4">
                        <label for="listingTags" class="form-label">
                            Tags
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="listingTags"
                            name="tags"
                            placeholder="e.g. furniture, books, electronics"
                        >
                    </div>

                    <div class="d-flex gap-2">
                        <button
                            type="submit"
                            class="btn modo-button flex-grow-1"
                        >
                            Save changes
                        </button>

                        <a href="/" class="btn btn-outline-dark">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </main>

    <footer class="border-top py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">
                &copy; 2026 MODO. A marketplace made for students.
            </p>
        </div>
    </footer>

    <script type="module" src="/src/js/Pages/listing-edit.js"></script>

</body>
</html>
